<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="linglowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Compact Sleek Container -->
  <rect x="1" y="1" width="318" height="78" rx="20" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5" />

  <!-- Minimalist Play & Spark Icon -->
  <g transform="translate(18, 14)">
    <!-- Icon background squircle -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#131B2E" stroke="#1E293B" stroke-width="1" />
    
    <!-- Smooth Play Triangle -->
    <path d="M 20 16.5 C 20 15.2 21.4 14.4 22.5 15.1 L 34.5 22.6 C 35.6 23.3 35.6 24.7 34.5 25.4 L 22.5 32.9 C 21.4 33.6 20 32.8 20 31.5 Z" fill="url(#linglowGrad)" />
    
    <!-- Small spark accent -->
    <circle cx="34" cy="14" r="2.8" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <text x="86" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">
    LING<tspan fill="url(#linglowGrad)">LOW</tspan>
  </text>
  
  <text x="87" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#94A3B8">
    AI VIDEO STUDIO
