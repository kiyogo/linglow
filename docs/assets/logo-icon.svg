<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="linglowGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base App Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0F172A" stroke="#1E293B" stroke-width="4" filter="url(#iconShadow)" />

  <!-- Monogram L + Play Triangle -->
  <g transform="translate(145, 130)">
    <!-- Vertical stem -->
    <rect x="0" y="0" width="48" height="230" rx="24" fill="url(#linglowGradIcon)" />
    <!-- Horizontal base -->
    <rect x="0" y="182" width="180" height="48" rx="24" fill="url(#linglowGradIcon)" />
    <!-- Play Spark Triangle -->
    <path d="M 88 70 L 175 115 L 88 160 Z" fill="url(#linglowGradIcon)" />
    <!-- Glowing pulse accent -->
    <circle cx="180" cy="55" r="16" fill="#38BDF8" />
  </g>
</svg>
